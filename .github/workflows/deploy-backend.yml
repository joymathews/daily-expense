# ==============================================================================
# GitHub Actions Workflow: Build & Deploy Backend API to Azure Container Apps
# ==============================================================================
#
# PURPOSE:
#   Builds the Node.js TypeScript Backend Docker image, pushes to GitHub Container
#   Registry (ghcr.io), and updates the ca-daily-expense-backend Container App revision.
#
# GITHUB SECRETS & VARIABLES REQUIRED:
# ------------------------------------------------------------------------------
# 1. Azure Authentication Secrets:
#    - AZURE_CLIENT_ID, AZURE_TENANT_ID, AZURE_SUBSCRIPTION_ID
#
# 2. Application Environment Secrets (Settings -> Secrets and variables -> Actions -> Secrets):
#    - COGNITO_USER_POOL_ID : AWS Cognito User Pool ID
#    - COGNITO_CLIENT_ID    : AWS Cognito App Client ID
#    - COGNITO_REGION       : AWS Region (e.g. us-east-1)
#    - DB_PROVIDER          : mssql (or sqlite)
#    - DATABASE_URL         : Full connection string to your Azure SQL DB
# ==============================================================================

name: Deploy Backend API to Azure Container Apps

on:
  workflow_dispatch: # Manual execution only from GitHub Actions UI

permissions:
  id-token: write # Required for Azure OIDC login
  contents: read
  packages: write # Required for pushing Docker images to ghcr.io

env:
  AZURE_RESOURCE_GROUP: rg-daily-expense-dev
  CONTAINER_APP_NAME: ca-daily-expense-backend
  IMAGE_NAME: daily-expense-backend
  TARGET_PORT: 3001

jobs:
  build-and-deploy:
    name: Build & Deploy Backend API
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Log in to Azure via OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Log in to GitHub Container Registry (ghcr.io)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Lowercase Repository Owner Name
        id: repo-owner
        run: |
          echo "owner=$(echo ${{ github.repository_owner }} | tr '[:upper:]' '[:lower:]')" >> $GITHUB_OUTPUT

      - name: Build and Push Backend Image to GHCR
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ steps.repo-owner.outputs.owner }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
            ghcr.io/${{ steps.repo-owner.outputs.owner }}/${{ env.IMAGE_NAME }}:latest

      - name: Deploy Revision to Azure Container App
        uses: azure/container-apps-deploy-action@v2
        with:
          resourceGroup: ${{ env.AZURE_RESOURCE_GROUP }}
          containerAppName: ${{ env.CONTAINER_APP_NAME }}
          imageToDeploy: ghcr.io/${{ steps.repo-owner.outputs.owner }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
          targetPort: ${{ env.TARGET_PORT }}
          environmentVariables: |
            NODE_ENV=production
            PORT=3001
            COGNITO_USER_POOL_ID=${{ secrets.COGNITO_USER_POOL_ID }}
            COGNITO_CLIENT_ID=${{ secrets.COGNITO_CLIENT_ID }}
            COGNITO_REGION=${{ secrets.COGNITO_REGION }}
            DB_PROVIDER=${{ secrets.DB_PROVIDER }}
            DATABASE_URL=${{ secrets.DATABASE_URL }}
            AZURE_SQL_SERVER=${{ secrets.AZURE_SQL_SERVER }}
            AZURE_SQL_DATABASE=${{ secrets.AZURE_SQL_DATABASE }}
            AZURE_SQL_USER=${{ secrets.AZURE_SQL_USER }}
            AZURE_SQL_PASSWORD=${{ secrets.AZURE_SQL_PASSWORD }}
            AZURE_SQL_PORT=1433
            LLM_EXTRACTION_SERVICE_SECRET=${{ secrets.LLM_EXTRACTION_SERVICE_SECRET }}
            LOG_LEVEL=info



